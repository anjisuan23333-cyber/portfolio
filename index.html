  <script>const dot=document.querySelector('.dot'),crosses=document.querySelectorAll('.project');let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y;const tick=()=>{x+=(tx-x)*.16;y+=(ty-y)*.16;dot.style.left=x+'px';dot.style.top=y+'px';requestAnimationFrame(tick)};addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY});crosses.forEach(el=>el.addEventListener('pointermove',e=>{const c=el.querySelector('.cross'),r=el.getBoundingClientRect();c.style.left=(e.clientX-r.left)+'px';c.style.top=(e.clientY-r.top)+'px'}));tick();</script>
